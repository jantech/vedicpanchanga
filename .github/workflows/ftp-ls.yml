name: FTP listing (temporary)

on: workflow_dispatch

jobs:
  ls:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP folders
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          for d in "" "public_html/" "public_html/astronode.in/" "astronode/"; do
            echo "== /$d"
            curl -sS --ssl-reqd --max-time 30 --list-only -u "$U:$P" "ftp://$H/$d" | head -40 || true
          done
